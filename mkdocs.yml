      - "Complementaria 15 — App Service networking y backup": complementarias/fase-complementaria-15-app-service-networking-y-backup.md
      - "Complementaria 16 — ACR y Container Apps": complementarias/fase-complementaria-16-contenedores-acr-y-container-apps.md
  - Referencia:
      - "Glosario de términos": referencia/glosario.md
      - "Glosario de productos": referencia/glosario-productos.md
      - "Comparativa de productos": referencia/comparativa-productos.md
      - "Repaso rápido": referencia/repaso-rapido.md
      - "Cobertura y temas no cubiertos": referencia/temas-no-cubiertos.md
  - Fuentes:
      - "Prerequisites for Azure administrators": "fuentes/AZ-104 Prerequisites for Azure administrators_links.md"
      - "Manage identities and governance": "fuentes/AZ-104 Manage identities and governance in Azure_links.md"
