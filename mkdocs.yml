      - "Fase 15 — Azure Application Gateway": fases/fase-15-intro-to-azure-application-gateway.md
      - "Fase 16 — Azure Network Watcher": fases/fase-16-intro-to-azure-network-watcher.md
      - "Fase 17 — Cuentas de almacenamiento": fases/fase-17-configure-storage-accounts.md
      - "Fase 18 — Azure Blob Storage": fases/fase-18-configure-blob-storage.md
      - "Fase 19 — Seguridad de Azure Storage": fases/fase-19-configure-storage-security.md
      - "Fase 20 — Azure Files y File Sync": fases/fase-20-configure-azure-files-file-sync.md
      - "Fase 21 — Introducción a las VM de Azure": fases/fase-21-intro-to-azure-virtual-machines.md
      - "Fase 22 — Disponibilidad y escalado de VM": fases/fase-22-configure-virtual-machine-availability.md
