site_name: AZ-104 — Guía de repaso
site_description: Repaso condensado para el examen Microsoft AZ-104 (Azure Administrator Associate)
site_author: AZ-104 Study Notes
# Cambia estas dos URLs por las de tu repositorio antes de publicar.
site_url: https://TU_USUARIO.github.io/az-104/
repo_url: https://github.com/TU_USUARIO/az-104
repo_name: TU_USUARIO/az-104
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Inicio: index.md
  - Progreso: progreso.md
  - Fases:
      - "Fase 1 — Azure Cloud Shell": fases/fase-01-intro-to-azure-cloud-shell.md
      - "Fase 2 — Crear plantillas ARM con VS Code": fases/fase-02-create-azure-resource-manager-template-vs-code.md
      - "Fase 3 — Microsoft Entra ID (introducción)": fases/fase-03-understand-azure-active-directory.md
      - "Fase 4 — Crear y administrar identidades": fases/fase-04-create-configure-manage-identities.md
      - "Fase 5 — Componentes arquitectónicos de Azure": fases/fase-05-describe-core-architectural-components-of-azure.md
      - "Fase 6 — Azure Policy y gobernanza en la nube": fases/fase-06-sovereignty-policy-initiatives.md
      - "Fase 7 — Azure RBAC": fases/fase-07-secure-azure-resources-with-rbac.md
      - "Fase 8 — Autoservicio de restablecimiento de contraseña": fases/fase-08-allow-users-reset-their-password.md
      - "Fase 9 — Redes virtuales y direccionamiento IP": fases/fase-09-configure-virtual-networks.md
      - "Fase 10 — NSG y ASG": fases/fase-10-configure-network-security-groups.md
